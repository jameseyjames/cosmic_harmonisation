<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: one test per page in a single reading column; reference panel sits directly above its questions, as it will in REDCap. */
:root{--bg:#f6f8f9;--surface:#ffffff;--panel:#eaf0f3;--panel-line:#c2cfd7;--ref:#f8f1de;--ref-line:#dccb98;--fg:#16242d;--muted:#51636f;--line:#d5dde2;--accent:#0f5e73;--accent-fg:#ffffff;--warn:#8a5a00;--pick:#e3eef2;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10181d;--surface:#18232a;--panel:#1f2e37;--panel-line:#35495a;--ref:#2c2816;--ref-line:#5b5026;--fg:#e6edf1;--muted:#9db0bb;--line:#2c3b45;--accent:#6cc3d8;--accent-fg:#0b1a20;--warn:#e0b45a;--pick:#22353f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10181d;--surface:#18232a;--panel:#1f2e37;--panel-line:#35495a;--ref:#2c2816;--ref-line:#5b5026;--fg:#e6edf1;--muted:#9db0bb;--line:#2c3b45;--accent:#6cc3d8;--accent-fg:#0b1a20;--warn:#e0b45a;--pick:#22353f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.notice{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:10px 14px}
.top{display:flex;flex-direction:column;gap:8px}
.top h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.prog{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.page{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--panel-line);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:21px;font-weight:600;margin:0;text-wrap:balance}
dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px;margin:0}
dt{font-weight:600;color:var(--muted);font-size:14px}dd{margin:0;min-width:0}
dd.unconf{color:var(--warn)}dd.src{font-size:14px;color:var(--muted)}
.ref{background:var(--ref);border:1px solid var(--ref-line);border-radius:6px;padding:14px 18px;display:flex;flex-direction:column;gap:4px}
.ref strong{font-weight:600}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:6px}.req{color:var(--warn)}.hint{font-weight:400;color:var(--muted);font-size:14px;display:block}
.opts{display:flex;flex-direction:column;gap:4px}.opts.h{flex-direction:row;flex-wrap:wrap;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.opts.h .opt{border-color:var(--line)}
.opt:hover{background:var(--pick)}.opt:has(input:checked){background:var(--pick);border-color:var(--accent)}
.opt input{accent-color:var(--accent);margin-top:4px;flex:none}.opt:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.defs{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}details.defs{border-top:0;padding-top:0;margin-top:-12px}details.defs summary{cursor:pointer;color:var(--accent);font-weight:500}
textarea,input[type=text],input[type=number]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
textarea{min-height:72px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px}
button{font:inherit;font-weight:500;padding:10px 20px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--warn);font-size:14px;min-height:1.4em}
@media (max-width:520px){dl{grid-template-columns:1fr;gap:2px 0}dt{margin-top:8px}.page{padding:16px}}
</style>

mals as they can in one minute.", "admin": "Given at home by trained interviewers as part of the 10/66 dementia research protocol.", "fmt": "Spoken instruction and response; timed, 60 seconds.", "score": "Number of correct animals named.", "unconf": "", "src": "SPAH variable labels; 10/66 protocol.", "refs": [{"name": "HRS-HCAP (USA, English): animal fluency", "desc": "The same task and time limit."}]}, {"test": "Two-step pointing command (window, then door)", "cohort": "Uganda study (MADRI)", "place": "South-western Uganda", "people": "Older adults in south-western Uganda. Age range and sampling to be confirmed.", "lang": "Local language (to be confirmed)", "task": "The interviewer asks the participant to point first to the window and then to the door.", "admin": "One item of the brief Community Screening Instrument for Dementia (7 items, 9 points).", "fmt": "Spoken instruction; pointing response; untimed.", "score": "0 or 1.", "unconf": "Language of administration; who the interviewers were.", "src": "Study coding sheet.", "refs": [{"name": "HRS-HCAP (USA, English): two-step pointing command", "desc": "The same item, taken from the same instrument: point first to the window and then to the door. 0 or 1."}]}, {"test": "Two-step pointing command (ceiling, then floor)", "cohort": "MYNAH and SPAH (same 10/66 protocol)", "place": "Mysore, India and São Paulo, Brazil", "people": "Older adults in two community cohorts. Many have little or no formal schooling.", "lang": "Local languages", "task": "The interviewer asks the participant to point to the ceiling and then to the floor.", "admin": "One item of the Community Screening Instrument for Dementia, given at home by trained interviewers.", "fmt": "Spoken instruction; pointing response; untimed.", "score": "0 or 1.", "unconf": "Language(s) used in MYNAH.", "src": "Variable labels in both data files.", "refs": [{"name": "HRS-HCAP (USA, English): two-step pointing command", "desc": "Point first to the window and then to the door. Same structure, different targets. 0 or 1."}, {"name": "Uganda study version (Test 4 in this questionnaire)", "desc": "Point first to the window and then to the door, in a local language. 0 or 1."}]}, {"test": "Trail Making Test, Part B", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The participant draws a line connecting circles in order, alternating between numbers and letters (1, A, 2, B and so on), as quickly as possible.", "admin": "Given by a trained examiner after Part A (numbers only).", "fmt": "Paper and pencil; timed.", "score": "Time to complete, in seconds. Errors and the number of circles connected are recorded separately.", "unconf": "Maximum time allowed.", "src": "MYHAT data dictionary.", "refs": [{"name": "HRS-HCAP (USA, English): Trail Making Test, Part B", "desc": "The same task. Score is seconds to complete, with errors adding to the time."}]}, {"test": "Trail Making Test, Part B (Greek version)", "cohort": "HELIAD", "place": "Greece", "people": "Community-dwelling adults aged 65 and over in two Greek cities. Many have few years of schooling.", "lang": "Greek", "task": "The participant draws a line connecting circles in order, alternating between numbers and letters, as quickly as possible.", "admin": "Greek standardised version (Vlahou and Kosmidis, 2002), given by a trained examiner.", "fmt": "Paper and pencil; timed, with a cap.", "score": "Time to complete, in seconds.", "unconf": "That the letters are from the Greek alphabet (assumed); the exact time cap.", "src": "HELIAD variable labels; published description of the HELIAD battery.", "refs": [{"name": "HRS-HCAP (USA, English): Trail Making Test, Part B", "desc": "Numbers and Latin letters. Score is seconds to complete, with errors adding to the time."}]}, {"test": "Digit span forward", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The examiner reads out a string of digits and the participant repeats it in the same order. Strings get longer, from 3 to 8 digits.", "admin": "Given by a trained examiner. Two trials at each length.", "fmt": "Spoken digits; spoken response; untimed.", "score": "One point per correct trial, total 0 to 12. Longest span is also recorded.", "unconf": "", "src": "MYHAT data dictionary.", "refs": []}, {"test": "MMSE serial sevens", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The participant is asked to subtract 7 from 100, and then to keep subtracting 7 from each answer, five times in all.", "admin": "One item of the Mini-Mental State Examination. MYHAT also records the alternative MMSE item (spelling a five-letter word backwards) as a separate score.", "fmt": "Spoken instruction and response; untimed.", "score": "One point per correct subtraction, 0 to 5.", "unconf": "", "src": "MYHAT data dictionary.", "refs": [{"name": "HRS-HCAP (USA, English): MMSE backward spelling", "desc": "HRS-HCAP uses the alternative item: spelling a five-letter word backwards, scored 0 to 5."}]}, {"test": "Letter fluency (P and S)", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The participant says as many words as they can that begin with a given letter in one minute. This is done twice: once for P and once for S.", "admin": "Given by a trained examiner.", "fmt": "Spoken instruction and response; timed, 60 seconds per letter.", "score": "Number of correct words for each letter; the two are also summed.", "unconf": "Rules for excluded words (names, repeated stems).", "src": "MYHAT data dictionary.", "refs": []}, {"test": "Modified Indiana University Token Test", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "Coloured tokens of different shapes and sizes are laid out. The participant carries out 12 spoken commands that get longer and more complex.", "admin": "Given by a trained examiner. A command can be given a second time after a failure.", "fmt": "Spoken commands; the participant moves or touches tokens; untimed.", "score": "Each command scores 0 to 2, total 0 to 24. Understood to be 2 for success first time and 1 for success on the second attempt.", "unconf": "The exact scoring rule for 1 versus 2 points.", "src": "MYHAT data dictionary.", "refs": []}, {"test": "Clock drawing (15-point scoring)", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The participant draws a clock face on a blank page, puts in all the numbers and sets the hands to a time given by the examiner.", "admin": "Given by a trained examiner. No model clock is shown.", "fmt": "Spoken instruction; drawn response; untimed.", "score": "15 criteria, one point each, covering the contour, the numbers (present, in order, in position, inside the face), the hands (present, hour, minute, proportion, joined) and the centre. Total 0 to 15.", "unconf": "The time the hands are set to.", "src": "MYHAT data dictionary.", "refs": []}, {"test": "CLOX1 (free-drawn clock)", "cohort": "KLOSCAD", "place": "South Korea", "people": "Community-dwelling adults aged 60 and over, sampled across South Korea.", "lang": "Korean", "task": "The participant is given a blank page and asked to draw a clock showing a stated time, with no further guidance.", "admin": "Given by a trained examiner. A second condition, in which the participant copies a clock drawn by the examiner (CLOX2), follows and is scored separately.", "fmt": "Spoken instruction; drawn response; untimed.", "score": "15-point checklist, 0 to 15.", "unconf": "", "src": "KLOSCAD variable labels; published CLOX procedure.", "refs": [{"name": "MYHAT clock drawing (Test 12 in this questionnaire)", "desc": "A clock drawn from a spoken instruction on a blank page, in English, scored on a different 15-point checklist."}]}, {"test": "WMS-R Visual Reproduction: immediate recall", "cohort": "MYHAT", "place": "Pennsylvania, USA", "people": "Community-dwelling adults aged 65 and over from small towns in south-western Pennsylvania.", "lang": "English", "task": "The participant looks at a geometric design for 10 seconds. It is then removed and they draw it from memory. This is done for four designs.", "admin": "Given by a trained examiner. Used in MYHAT until February 2016.", "fmt": "Printed designs; drawn response.", "score": "Each drawing is scored against set criteria. Total 0 to 41.", "unconf": "", "src": "MYHAT data dictionary; standard WMS-R procedure.", "refs": []}, {"test": "Anomalous sentence repetition", "cohort": "HELIAD", "place": "Greece", "people": "Community-dwelling adults aged 65 and over in two Greek cities. Many have few years of schooling.", "lang": "Greek", "task": "The examiner reads out 14 common Greek sayings, each with one word replaced by an incorrect word. The participant must repeat each sentence exactly as heard, without correcting it.", "admin": "An original Greek test, given by a trained examiner.", "fmt": "Spoken sentences; spoken response; untimed.", "score": "Number of sentences repeated exactly, 0 to 14.", "unconf": "", "src": "HELIAD variable labels; published description of the HELIAD battery.", "refs": []}, {"test": "Months backward", "cohort": "HELIAD", "place": "Greece", "people": "Community-dwelling adults aged 65 and over in two Greek cities. Many have few years of schooling.", "lang": "Greek", "task": "The participant recites the months of the year in reverse order, as fast as they can.", "admin": "Given by a trained examiner, after the participant has recited the months in forward order.", "fmt": "Spoken instruction and response; timed.", "score": "Time in seconds. Errors are recorded separately.", "unconf": "", "src": "HELIAD variable labels; published description of the HELIAD battery.", "refs": []}, {"test": "Semantic fluency: objects", "cohort": "HELIAD", "place": "Greece", "people": "Community-dwelling adults aged 65 and over in two Greek cities. Many have few years of schooling.", "lang": "Greek", "task": "The participant is asked to name as many different objects as they can in one minute.", "admin": "Given by a trained examiner. The category is objects, not animals.", "fmt": "Spoken instruction and response; timed, 60 seconds.", "score": "Number of correct words.", "unconf": "", "src": "HELIAD variable labels; published description of the HELIAD battery.", "refs": [{"name": "HRS-HCAP (USA, English): animal fluency", "desc": "Same time limit, but the category is animals."}]}, {"test": "10-word list learning (10/66 version)", "cohort": "MYNAH and SPAH (same 10/66 protocol)", "place": "Mysore, India and São Paulo, Brazil", "people": "Older adults in two community cohorts. Many have little or no formal schooling.", "lang": "Local languages", "task": "The interviewer reads a list of 10 words aloud and the participant says back as many as they can remember. The same list is read and recalled three times.", "admin": "Given at home by trained interviewers. Word lists are translated.", "fmt": "Spoken words only (nothing is shown in writing); spoken response; untimed.", "score": "Total words recalled over the three trials, 0 to 30.", "unconf": "Whether the word order changes between trials.", "src": "Variable labels in both data files; 10/66 protocol.", "refs": [{"name": "HRS-HCAP (USA, English): CERAD word list learning", "desc": "Each word is shown on a card for 2 seconds and the participant reads it aloud. Three trials, 0 to 30."}, {"name": "HCAP studies that read the list aloud (LASI-DAD in India, Mex-Cog in Mexico)", "desc": "The examiner reads the 10 words aloud and nothing is shown in writing. Three trials, 0 to 30. In Mex-Cog the word order is the same on every trial."}]}], "domains": [[1, "Orientation", "knowing the current time, date and place"], [2, "Memory", "learning new information and recalling or recognising it later"], [3, "Attention / processing speed", "focusing and sustaining attention, and the speed of simple mental operations"], [4, "Executive function", "controlling and organising thinking: switching, inhibition, holding and manipulating information, reasoning, planning"], [5, "Language", "understanding and producing words and sentences: naming, comprehension, repetition, word retrieval, reading, writing"], [6, "Visuospatial / constructional", "perceiving spatial relations and copying or constructing figures"]], "extra": [[7, "No single domain: it draws on several about equally"], [8, "Another domain not listed here"], [99, "Cannot judge from the information given"]], "conf": [[1, "1 Not at all"], [2, "2 Slightly"], [3, "3 Moderately"], [4, "4 Very"], [5, "5 Completely"]], "bias": [[1, "Literacy or years of schooling"], [2, "The language or translation used"], [3, "Cultural familiarity with the materials or the task"], [4, "Vision, hearing or hand movement"], [5, "Who gives the test and in what setting"], [0, "None of these"]], "link": [[1, "Confident link: I know of no difference that would make them behave differently"], [2, "Tentative link: there are possible differences, so link only if statistical checks show no bias"], [3, "No link: the differences mean they should be treated as different items"], [99, "Cannot judge from the information given"]], "reasons": [[1, "Language or translation"], [2, "Different content or stimuli"], [3, "How it is presented (spoken, written, shown)"], [4, "Timing or number of trials"], [5, "Scoring"], [6, "Literacy or schooling demands"], [7, "Cultural familiarity"], [8, "Other (please explain in the comments)"]], "intro": "<b>Thank you for taking part.<\/b> COSMIC is bringing together cognitive test data from ageing studies around the world, using the Harmonized Cognitive Assessment Protocol (HCAP) as the reference. Before any statistics, we need expert judgement on two things: what each test measures, and which tests are similar enough across studies to act as links between them.<br><br>You will see <b>18 tests, one per page<\/b>. Each page starts with a <b>reference panel<\/b> describing the test as it was given in one study. Please judge that version, not the test in general. Existing classifications are deliberately not shown.<br><br><b>For each test we ask:<\/b> which cognitive domain it mainly measures; any other domains; how confident you are; what else might affect scores; and, where there is a comparison item, whether the two could be linked.<br><br><b>Your answers are confidential.<\/b> They are stored under a code, not your name, and only the moderator can match codes to people. Please answer on your own and do not discuss your answers with other panel members. In Round 2 you will see the group's anonymised answers next to your own.<br><br><i>Cannot judge<\/i> is a valid answer and tells us the description needs more detail. This takes about 45 to 60 minutes, and you can save and return."};const N=DATA.cards.length;const ans={};let pg=0;const TOTAL=N+2;

      group(p+'_conf','How confident are you in your choice of main domain?',DATA.conf,{req:true,horiz:true})+
      group(p+'_bias',"Apart from the ability being measured, is a person's score on this version likely to be noticeably affected by any of these?",DATA.bias,{multi:true,req:true,hint:'Tick all that apply. This tells us where to check for bias between studies.',none:0})+
      c.refs.map((r,k)=>{const s=`${p}_link${k+1}`;return `<div class="ref"><div class="eyebrow">Comparison item</div><strong>${esc(r.name)}</strong><span>${esc(r.desc)}</span></div>`+
        group(s,'Could the test in the reference panel be linked to this comparison item? In other words, would two people of the same ability be expected to get the same score on both?',DATA.link,{req:true})+
        group(s+'_why','What differs?',DATA.reasons,{multi:true,hint:'Tick all that apply.',showIf:s+'=2|3'});}).join('')+
      text(p+'_comment','Comments',{hint:'Optional. For example: what further information would change your answer?'});}
  else{h=`<div class="eyebrow">About this questionnaire</div>`+text('fb_minutes','About how many minutes did this take you?',{req:true,single:true})+
    text('fb_info','Did each reference panel give you enough information to judge? What was missing?')+text('fb_domains','Were the domains and their definitions adequate? Would you add, split or merge any?')+
    text('fb_link','Was the question about linking to a comparison item clear? How would you reword it?')+text('fb_other','Any other comments');}
  el.innerHTML=h;document.getElementById('plabel').textContent=`Page ${pg+1} of ${TOTAL}`;document.getElementById('pbar').style.width=((pg+1)/TOTAL*100)+'%';
  document.getElementById('back').disabled=pg===0;document.getElementById('next').textContent=pg===TOTAL-1?'Finish preview':'Next';document.getElementById('msg').textContent='';branch();}
function val(name){const r=document.querySelector(`#page input[name="${name}"]:checked`);return r?r.value:null;}
function branch(){document.querySelectorAll('#page fieldset[data-showif]').forEach(fs=>{const [n,v]=fs.dataset.showif.split('=');fs.hidden=!v.split('|').includes(val(n));});}
document.getElementById('page').addEventListener('change',e=>{const t=e.target;const fs=t.closest('fieldset');
  if(t.type==='checkbox'&&fs.dataset.none!==''){const none=fs.dataset.none;if(t.value===none&&t.checked)fs.querySelectorAll('input').forEach(i=>{if(i!==t)i.checked=false;});else if(t.checked){const n=fs.querySelector(`input[value="${none}"]`);if(n)n.checked=false;}}
  branch();});
function collect(){document.querySelectorAll('#page fieldset').forEach(fs=>{const ins=fs.querySelectorAll('input[type=radio],input[type=checkbox]');
  if(ins.length){const id=ins[0].name;if(ins[0].type==='checkbox')ans[id]=[...ins].filter(i=>i.checked).map(i=>+i.value);else{const c=[...ins].find(i=>i.checked);ans[id]=c?+c.value:null;}}
  else{const t=fs.querySelector('textarea,input');if(t)ans[t.id]=t.value;}});}
function missing(){return [...document.querySelectorAll('#page fieldset')].some(fs=>{if(fs.hidden||!fs.querySelector('.req'))return false;const r=fs.querySelectorAll('input[type=radio],input[type=checkbox]');
  if(r.length)return ![...r].some(i=>i.checked);const t=fs.querySelector('textarea,input');return t&&!t.value.trim();});}
document.getElementById('next').onclick=()=>{collect();if(missing()){document.getElementById('msg').textContent='Please answer the questions marked * before continuing.';return;}
  if(pg<TOTAL-1){pg++;render();window.scrollTo(0,0);}else document.getElementById('msg').textContent='End of preview. In REDCap this is where the rater submits.';};
document.getElementById('back').onclick=()=>{collect();if(pg>0){pg--;render();window.scrollTo(0,0);}};
render();
</script>
